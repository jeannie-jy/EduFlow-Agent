# Limited Render demonstration deployment.
# This intentionally omits task workers, material parsing, maintenance isolation,
# video rendering, durable object storage, production KMS, and observability.

services:
  - type: web
    name: eduflow-app
    runtime: docker
    plan: free
    region: singapore
    dockerContext: .
    dockerfilePath: ./ops/render/Dockerfile
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: eduflow-limited-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: eduflow-limited-kv
          type: keyvalue
          property: connectionString
      - key: ENVIRONMENT
        value: development
      - key: LOG_FORMAT
        value: json
      - key: AUTH_REQUIRED
        value: "true"
      - key: AUTH_COOKIE_SECURE
        value: "true"
      - key: AUTH_ALLOW_REGISTRATION
        value: "true"
      - key: AUTH_REQUIRE_EMAIL_VERIFICATION
        value: "false"
      - key: AUTH_REGISTRATION_CHALLENGE_REQUIRED
        value: "false"
      - key: ENFORCE_ORIGIN_CHECK
        value: "true"
      - key: EXPOSE_API_DOCS
        value: "false"
      - key: RUN_MAINTENANCE
        value: "true"
      - key: BYOK_REQUIRED
        value: "true"
      - key: CREDENTIAL_KMS_BACKEND
        value: local
      - key: CREDENTIAL_KEK_B64
        generateValue: true
      - key: CREDENTIAL_FINGERPRINT_KEY_B64
        generateValue: true
      - key: CREDENTIAL_KEK_VERSION
        value: render-limited-v1
      - key: ARTIFACT_STORE_BACKEND
        value: local
      - key: MATERIAL_PARSE_EXECUTION_MODE
        value: inline
      - key: MANIM_EXECUTION_MODE
        value: disabled
      - key: VIDEO_PUBLIC_ENABLED
        value: "false"
      - key: OTEL_ENABLED
        value: "false"
      - key: QUOTA_GENERATION_DAILY
        value: "3"
      - key: QUOTA_GENERATION_MONTHLY
        value: "20"
      - key: QUOTA_GENERATION_CONCURRENT
        value: "1"
      - key: QUOTA_VIDEO_DAILY
        value: "0"
      - key: QUOTA_VIDEO_MONTHLY
        value: "0"

  - type: keyvalue
    name: eduflow-limited-kv
    plan: free
    region: singapore
    ipAllowList: []
    maxmemoryPolicy: allkeys-lru

databases:
  - name: eduflow-limited-db
    plan: free
    region: singapore
    postgresMajorVersion: "16"
    databaseName: eduflow
    user: eduflow
    ipAllowList: []
