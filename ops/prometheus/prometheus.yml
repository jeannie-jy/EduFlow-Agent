global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: eduflow-agent
    metrics_path: /api/metrics/prometheus
    # In production point METRICS_TOKEN_FILE at a Secret Manager-mounted file.
    # The API returns 404 for scrapes without this bearer token.
    bearer_token_file: /etc/prometheus/metrics-token
    static_configs:
      - targets: [agent-api:8000]
