# Stage-one production overlay: one Linux application node with managed data services.
# Apply together with the repository root docker-compose.yml.
# Requires Docker Compose 2.24+ for !reset/!override merge tags.

x-agent-image: &agent-image
  image: ${AGENT_IMAGE:?Set AGENT_IMAGE to an immutable tag or digest}
  pull_policy: always

x-production-runtime: &production-runtime
  init: true
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: "20m"
      max-file: "5"

x-managed-services: &managed-services
  DATABASE_URL: ${DATABASE_URL:?Set managed PostgreSQL DATABASE_URL}
  REDIS_URL: ${REDIS_URL:?Set managed Redis REDIS_URL}
  ARTIFACT_STORE_BACKEND: minio
  MINIO_ENDPOINT: ${MINIO_ENDPOINT:?Set S3-compatible endpoint without scheme}
  MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT:?Set browser-accessible object endpoint}
  MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:?Set object storage access key}
  MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?Set object storage secret key}
  MINIO_BUCKET: ${MINIO_BUCKET:-eduflow-artifacts}
  MINIO_SECURE: ${MINIO_SECURE:-true}

x-production-security: &production-security
  ENVIRONMENT: production
  LOG_FORMAT: json
  PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:?Set the public HTTPS origin}
  ENFORCE_ORIGIN_CHECK: "true"
  TRUSTED_PROXY_IPS: ${TRUSTED_PROXY_IPS:?Set only the ingress proxy CIDR/IP}
  EXPOSE_API_DOCS: "false"
  METRICS_ACCESS_TOKEN: ${METRICS_ACCESS_TOKEN:?Set the internal metrics token}
  RUN_MAINTENANCE: "false"
  AUTH_REQUIRED: "true"
  AUTH_COOKIE_SECURE: "true"
  AUTH_ALLOW_REGISTRATION: ${AUTH_ALLOW_REGISTRATION:-false}
  AUTH_REQUIRE_EMAIL_VERIFICATION: "true"
  AUTH_REGISTRATION_CHALLENGE_REQUIRED: "true"
  AUTH_REGISTRATION_CHALLENGE_SECRET: ${AUTH_REGISTRATION_CHALLENGE_SECRET:?Set registration challenge secret}
  SMTP_HOST: ${SMTP_HOST:?Set SMTP host}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_USERNAME: ${SMTP_USERNAME:?Set SMTP username}
  SMTP_PASSWORD: ${SMTP_PASSWORD:?Set SMTP password}
  SMTP_FROM: ${SMTP_FROM:?Set SMTP sender}
  SMTP_STARTTLS: ${SMTP_STARTTLS:-true}
  BYOK_REQUIRED: "true"
  LLM_API_KEY: ""
  EMBEDDING_API_KEY: ""
  LLM_BACKUP_API_KEY: ""
  CREDENTIAL_KMS_BACKEND: http
  CREDENTIAL_KMS_WRAP_URL: ${CREDENTIAL_KMS_WRAP_URL:?Set internal HTTPS KMS wrap URL}
  CREDENTIAL_KMS_UNWRAP_URL: ${CREDENTIAL_KMS_UNWRAP_URL:?Set internal HTTPS KMS unwrap URL}
  CREDENTIAL_KMS_BEARER_TOKEN: ${CREDENTIAL_KMS_BEARER_TOKEN:?Set KMS bridge token}
  CREDENTIAL_FINGERPRINT_KEY_B64: ${CREDENTIAL_FINGERPRINT_KEY_B64:?Set fingerprint HMAC key}
  CREDENTIAL_KEK_B64: ""
  CREDENTIAL_KEK_VERSION: ${CREDENTIAL_KEK_VERSION:?Set KMS key version}
  AUDIT_ARCHIVE_HMAC_KEY: ${AUDIT_ARCHIVE_HMAC_KEY:?Set audit archive HMAC key}
  VIDEO_PUBLIC_ENABLED: "false"
  VIDEO_PUBLIC_ISOLATION_APPROVED: "false"

services:
  web:
    image: ${WEB_IMAGE:?Set WEB_IMAGE to an immutable tag or digest}
    build: !reset null
    pull_policy: always
    ports: !override
      - "${WEB_BIND_ADDRESS:-127.0.0.1}:${WEB_PORT:-5173}:80"
    <<: *production-runtime
    mem_limit: 256m
    cpus: 0.5
    read_only: true
    tmpfs:
      - /var/cache/nginx:size=64m,mode=0755
      - /var/run:size=8m,mode=0755
    cap_drop: ["ALL"]
    cap_add: ["CHOWN", "SETGID", "SETUID", "NET_BIND_SERVICE"]
    security_opt:
      - no-new-privileges:true

  migrate:
    <<: *agent-image
    build: !reset null
    environment: !override
      DATABASE_URL: ${DATABASE_URL:?Set managed PostgreSQL DATABASE_URL}
    depends_on: !reset {}
    restart: "no"

  agent-api:
    <<: [*agent-image, *production-runtime]
    build: !reset null
    # The host TLS proxy routes /api directly here so it can replace untrusted
    # forwarding headers with the real client address. This remains loopback-only.
    ports: !override
      - "127.0.0.1:${API_PORT:-8000}:8000"
    environment:
      <<: [*managed-services, *production-security]
      OTEL_ENABLED: ${OTEL_ENABLED:-false}
      OTEL_SERVICE_NAME: eduflow-agent
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_HEADERS: ${OTEL_EXPORTER_OTLP_HEADERS:-}
      OTEL_TRACE_SAMPLE_RATIO: ${OTEL_TRACE_SAMPLE_RATIO:-0.1}
      MANIM_EXECUTION_MODE: disabled
    depends_on: !reset {}
    mem_limit: 2g
    cpus: 2.0
    pids_limit: 256

  task-worker:
    <<: [*agent-image, *production-runtime]
    build: !reset null
    environment:
      <<: [*managed-services, *production-security]
      OTEL_ENABLED: ${OTEL_ENABLED:-false}
      OTEL_SERVICE_NAME: eduflow-task-worker
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_HEADERS: ${OTEL_EXPORTER_OTLP_HEADERS:-}
      OTEL_TRACE_SAMPLE_RATIO: ${OTEL_TRACE_SAMPLE_RATIO:-0.1}
      MATERIAL_PARSE_EXECUTION_MODE: sandbox
      MATERIAL_SANDBOX_DIR: /app/data/material-sandbox
    depends_on:
      agent-api:
        condition: service_healthy
      material-sandbox:
        condition: service_started

  maintenance:
    <<: [*agent-image, *production-runtime]
    build: !reset null
    environment:
      <<: *managed-services
      ENVIRONMENT: production
      LOG_FORMAT: json
      AUDIT_ARCHIVE_HMAC_KEY: ${AUDIT_ARCHIVE_HMAC_KEY:?Set audit archive HMAC key}
    depends_on: !reset {}

  material-sandbox:
    <<: [*agent-image, *production-runtime]
    build: !reset null

  render-worker:
    <<: [*agent-image, *production-runtime]
    build: !reset null
    environment:
      <<: [*managed-services, *production-security]
      MANIM_EXECUTION_MODE: worker
      MANIM_SCRIPT_MODE: ${MANIM_SCRIPT_MODE:-deterministic}
    depends_on: !reset {}

  render-sandbox:
    <<: [*agent-image, *production-runtime]
    build: !reset null

  # Local stateful services are deliberately unavailable in the normal production
  # invocation. They can only be started with the explicit local-infra profile.
  postgres:
    profiles: ["local-infra"]
  redis:
    profiles: ["local-infra"]
  minio:
    profiles: ["local-infra"]

  prometheus:
    profiles: ["observability"]
    <<: *production-runtime

  grafana:
    profiles: ["observability"]
    <<: *production-runtime

networks:
  default:
    name: eduflow-production
    ipam:
      config:
        - subnet: ${COMPOSE_NETWORK_CIDR:-172.31.240.0/24}
