name: Backend CI

on:
  push:
    branches: [main, dev]
    paths:
      - "agent/**"
  pull_request:
    branches: [main, dev]
    paths:
      - "agent/**"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: agent/requirements-ci.txt

      - name: Install dependencies
        run: pip install -r requirements-ci.txt

      - name: Run tests
        run: python -m pytest tests/ -v --tb=short

  render-smoke:
    # 真实渲染验证：安装完整 requirements.txt（含 manim）+ 系统库，
    # 把 golden 脚本真实渲染成 MP4，验证视频导出整条工具链。
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: agent/requirements.txt

      - name: Install system libs (cairo/pango for manim)
        run: sudo apt-get update && sudo apt-get install -y libcairo2 libpango-1.0-0 libpangocairo-1.0-0

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Render smoke tests
        run: python -m pytest tests/test_manim_render_smoke.py -v --tb=short
