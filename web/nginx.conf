server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Match the API's bounded streaming upload reader so oversized bodies are
    # rejected at the edge before they consume proxy or application memory.
    client_max_body_size 50m;
    client_body_timeout 30s;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # The managed TLS edge should also emit this header; keeping it here makes
    # the policy survive a transparent proxy and protects direct HTTPS use.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; frame-ancestors 'none'; object-src 'none'; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self'; script-src 'self' 'sha256-csHc+lPQS6kQzy84mInyHOl3kPF6/3DzqmW7LVbLTOY='; style-src 'self' 'unsafe-inline'; font-src 'self' data:; frame-src 'self'; form-action 'self'" always;

    # Generated demos run in an opaque-origin iframe. This one document may use
    # inline scripts/styles, but cannot connect to the network or access the app.
    location = /sandbox.html {
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'none'; base-uri 'none'; connect-src 'none'; form-action 'none'; frame-ancestors 'self'; img-src data: blob:; media-src blob:; script-src 'self' 'unsafe-inline'; style-src 'unsafe-inline'" always;
        try_files /sandbox.html =404;
    }

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Operational metrics stay on the internal API network. Prometheus scrapes
    # agent-api directly; the public Web reverse proxy must not expose them.
    location = /api/metrics { return 404; }
    location = /api/metrics/prometheus { return 404; }

    location /api/ {
        proxy_pass http://agent-api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Never forward a client-supplied X-Forwarded-For chain. The trusted
        # ingress/load balancer is responsible for adding the real client IP;
        # this local proxy contributes only its directly-connected peer.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 650s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
