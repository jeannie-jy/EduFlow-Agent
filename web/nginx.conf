server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Operational metrics stay on the internal API network. Prometheus scrapes
    # agent-api directly; the public Web reverse proxy must not expose them.
    location = /api/metrics { return 404; }
    location = /api/metrics/prometheus { return 404; }

    location /api/ {
        proxy_pass http://agent-api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_read_timeout 650s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
